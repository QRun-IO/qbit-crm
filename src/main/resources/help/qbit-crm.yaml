      Use **{{label:crm_consent_record}}** to review immutable evidence of a consent decision.

      **How rows get created:** Intake, subscriptions and withdrawals record consent evidence. Review the recorded wording and dates. Ordinary edits are blocked; **Erase Personal Data** can redact evidence text.
