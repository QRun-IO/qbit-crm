  - key: table:crm_email_list;slot:help
    summary: "Mailing lists and opt-in settings."
    content: |
      Use **Lists** to organize subscriptions and choose whether a recipient must confirm membership. Open a list to review its members and their subscription status. Use **Add to List** or **Remove from List** from Contacts to change membership. Membership alone does not establish permission for marketing email; review the recorded consent as well.

      **How rows get created:** Create a list with **New** and choose its confirmation requirements. Contacts can join through **Add to List** or your configured subscription form.
