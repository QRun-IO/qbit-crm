  - key: table:crm_company;slot:help
    summary: "Organizations linked to contacts and deals."
    content: |
      Use **Companies** to group the organizations linked to your contacts and deals. Record the company name and domain so you can distinguish similar organizations. Open a company to review its contacts, activities and sales opportunities. Use **Merge Companies** only after checking which record you want to keep and the relationships attached to both records.

      **How rows get created:** Add a company with **New** or import your company records. You can then link contacts and deals to it.
