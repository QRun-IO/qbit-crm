  - key: table:crm_job_state;field:lastFullPass
    summary: "When the maintenance job last completed a full pass."
  - key: table:crm_lifecycle_stage;slot:help
    summary: "Lifecycle categories for contacts, such as lead and customer."
    content: |
      Use **{{label:crm_lifecycle_stage}}** to review lifecycle categories for contacts, such as lead and customer.

      **How rows get created:** Add relationship stages with **New**. Ask your administrator to keep the configured stages aligned with intake and deal-creation workflows. If your administrator installs the optional CRM defaults, it seeds starter records where applicable. Review the records configured for your installation.
