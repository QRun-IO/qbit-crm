bundle: qbit-crm
version: 1
layer: QBIT
entries:
  - key: app:crm;slot:help
    summary: "Manage relationships, sales opportunities and consent."
    content: |
      Use **Contacts**, **Companies**, **Deals**, **Activities**, **Web Leads** and **Lists** for daily work. Configure pipelines, outcomes and outreach in Settings. Marketing email requires recorded consent and a ready email transport.
  - key: table:crm_job_state;slot:help
    summary: "Internal maintenance checkpoints."
    content: |
      Internal maintenance checkpoints. Health checks use the last successful lead-score run.
  - key: table:crm_external_mapping;slot:help
    summary: "Links between CRM records and identifiers in external systems."
    content: |
      Links between CRM records and identifiers in external systems. Keep each system mapping unique.
  - key: table:crm_assignment_rule;slot:help
    summary: "Rules for selecting the owner of a new contact or deal."
    content: |
      Rules for selecting the owner of a new contact or deal.
  - key: table:crm_assignment_rule_member;slot:help
    summary: "Users eligible for a group assignment rule."
    content: |
      Users eligible for a group assignment rule. Membership determines who can receive assigned work.
  - key: table:crm_lead_score_rule;slot:help
    summary: "Conditions that add or subtract lead-score points."
    content: |
      Conditions that add or subtract lead-score points. Review rule order and decay behavior.
  - key: table:crm_sales_goal;slot:help
    summary: "Revenue targets for a user and period, optionally limited to a pipeline."
    content: |
      Revenue targets for a user and period, optionally limited to a pipeline.
  - key: table:crm_email_message;slot:help
    summary: "Delivery information and content for an email associated with a contact or activity."
    content: |
      Delivery information and content for an email associated with a contact or activity.
  - key: table:crm_email_sequence;slot:help
    summary: "Ordered outreach steps."
    content: |
      Ordered outreach steps. Activate only after reviewing the steps, timing and email consent requirements.
  - key: table:crm_email_template;slot:help
    summary: "Reusable email subject and content."
    content: |
      Reusable email subject and content. Review merged content before sending to recipients.
  - key: table:crm_sequence_enrollment;slot:help
    summary: "A contact enrolled in a sequence, with progress, status and next scheduled step."
    content: |
      A contact enrolled in a sequence, with progress, status and next scheduled step.
  - key: table:crm_sequence_step;slot:help
    summary: "One timed action in an outreach sequence."
    content: |
      One timed action in an outreach sequence. Email steps require a usable template and transport.
  - key: table:crm_contact_role;slot:help
    summary: "Roles a contact can play in a deal or relationship."
    content: |
      Roles a contact can play in a deal or relationship.
  - key: table:crm_deal;slot:help
    summary: "Sales opportunities tracked through a pipeline."
    content: |
      Sales opportunities tracked through a pipeline. Select a pipeline before choosing its stage.
  - key: table:crm_deal;field:id
    summary: "System-assigned record identifier."
    content: |
      System-assigned record identifier. Use this value when linking records or investigating an import.
  - key: table:crm_deal;field:name
    summary: "The display name shown in lists and record links."
    content: |
      The display name shown in lists and record links. Choose a name that is easy to recognize.
  - key: table:crm_deal;field:pipelineId
    summary: "The sales pipeline for this record."
    content: |
      The sales pipeline for this record. Its stages determine the available stage choices.
  - key: table:crm_deal;field:pipelineStageId
    summary: "The current stage within the chosen pipeline."
    content: |
      The current stage within the chosen pipeline. A stage from another pipeline is rejected.
  - key: table:crm_deal;field:amount
    summary: "The deal amount in the selected currency."
    content: |
      The deal amount in the selected currency. Product changes can recalculate this amount.
  - key: table:crm_deal;field:currencyCode
    summary: "Currency of the deal amount."
    content: |
      Currency of the deal amount. Choose a configured currency code.
  - key: table:crm_deal;field:amountInBaseCurrency
    summary: "The deal amount converted to the configured base currency for reporting."
    content: |
      The deal amount converted to the configured base currency for reporting.
  - key: table:crm_deal;field:probabilityOverridePct
    summary: "Optional closing probability percentage that overrides the stage probability."
    content: |
      Optional closing probability percentage that overrides the stage probability.
  - key: table:crm_deal;field:weightedAmount
    summary: "The deal amount weighted by its probability of closing."
    content: |
      The deal amount weighted by its probability of closing.
  - key: table:crm_deal;field:companyId
    summary: "The linked company."
    content: |
      The linked company. Select an existing company so contacts and deals share the same organization.
  - key: table:crm_deal;field:primaryContactId
    summary: "The main contact for this deal."
    content: |
      The main contact for this deal. Choose the company first to narrow the choices.
  - key: table:crm_deal;field:ownerUserId
    summary: "The user responsible for following up on this record."
    content: |
      The user responsible for following up on this record.
  - key: table:crm_deal;field:leadSourceId
    summary: "The source that brought this contact or deal to your organization."
    content: |
      The source that brought this contact or deal to your organization.
  - key: table:crm_deal;field:expectedCloseDate
    summary: "The date you expect the opportunity to close."
    content: |
      The date you expect the opportunity to close. Keep it current for forecasts.
  - key: table:crm_deal;field:actualCloseDate
    summary: "When the deal was won or lost."
    content: |
      When the deal was won or lost. Reopening clears the closed state.
  - key: table:crm_deal;field:winLossReasonId
    summary: "Why the deal was won or lost."
    content: |
      Why the deal was won or lost. Select the reason that best explains the outcome.
  - key: table:crm_deal;field:stageEnteredDate
    summary: "When the deal entered its current stage, used to identify deals that have stalled."
    content: |
      When the deal entered its current stage, used to identify deals that have stalled.
  - key: table:crm_deal;field:description
    summary: "Additional context for this record."
    content: |
      Additional context for this record. Include only information needed for the relationship.
  - key: table:crm_deal;field:priority
    summary: "Relative urgency used to organize work."
    content: |
      Relative urgency used to organize work.
  - key: table:crm_deal;field:lastActivityDate
    summary: "The latest logged interaction date maintained by the CRM."
    content: |
      The latest logged interaction date maintained by the CRM.
  - key: table:crm_deal;field:createDate
    summary: "When this record was created."
    content: |
      When this record was created. The system maintains this timestamp.
  - key: table:crm_deal;field:modifyDate
    summary: "When this record was last changed."
    content: |
      When this record was last changed. The system maintains this timestamp.
  - key: table:crm_deal;field:tenantKey
    summary: "The tenant that owns this record."
    content: |
      Available only when the host enables CRM tenancy. The session must hold the matching tenant key; changing this value changes who can access the record.
  - key: table:crm_deal_contact;slot:help
    summary: "Contacts involved in a deal, with their relationship or role."
    content: |
      Contacts involved in a deal, with their relationship or role.
  - key: table:crm_deal_product;slot:help
    summary: "Product quantities and prices on a deal."
    content: |
      Product quantities and prices on a deal. Changes recalculate the deal total.
  - key: table:crm_deal_stage_history;slot:help
    summary: "The history of a deal moving between pipeline stages."
    content: |
      The history of a deal moving between pipeline stages.
  - key: table:crm_pipeline;slot:help
    summary: "Sales pipelines that group stages."
    content: |
      Sales pipelines that group stages. Give each pipeline a clear purpose and ordered stages.
  - key: table:crm_pipeline_stage;slot:help
    summary: "Ordered stages within a pipeline, with probability, required fields and won or lost outcomes."
    content: |
      Ordered stages within a pipeline, with probability, required fields and won or lost outcomes.
  - key: table:crm_product;slot:help
    summary: "Products and services available as deal line items."
    content: |
      Products and services available as deal line items. Check price and currency before adding to a deal.
  - key: table:crm_win_loss_reason;slot:help
    summary: "Reasons for winning or losing a deal."
    content: |
      Reasons for winning or losing a deal. Use these to improve pipeline reporting.
  - key: table:crm_company;slot:help
    summary: "Organizations linked to contacts and deals."
    content: |
      Organizations linked to contacts and deals. Use domain to distinguish similarly named companies.
  - key: table:crm_company;field:id
    summary: "System-assigned record identifier."
    content: |
