      Use **{{label:crm_lead_source}}** to review where a contact or deal originated.

      **How rows get created:** Add sources with **New**. Use consistent categories when recording where contacts and deals originated. If your administrator installs the optional CRM defaults, it seeds starter records where applicable. Review the records configured for your installation.
