  - key: table:crm_deal;slot:help
    summary: "Sales opportunities tracked through a pipeline."
    content: |
      Use **Deals** to track sales opportunities through a pipeline. Choose **Pipeline** before **Pipeline Stage**, then record the amount, currency, expected close date and owner. Use **Move Stage**, **Mark Won**, **Mark Lost** or **Reopen** as the opportunity changes. Related contacts, products and stage history give you context for reviewing the deal.

      **How rows get created:** Use **New** to create an opportunity, or **Create Deal** on a contact. Choose the pipeline and stage before reviewing the new deal.
