  - key: process:crm_calculate_lead_scores;slot:help
    summary: "Refresh contact lead scores from active rules and save the successful-run checkpoint."
    content: |
      ### {{label:crm_calculate_lead_scores}}

      Use **{{label:crm_calculate_lead_scores}}** to refresh contact scores from active rules, including rules based on related company values. A successful run saves a maintenance checkpoint and checks deals needing attention. Your administrator can schedule this work or invoke it directly. Use **Recalculate Score** on Contacts to refresh selected contacts immediately.
  - key: process:crm_bulk_assign_owner;slot:help
    summary: "Choose the user who will own the selected records."
    content: |
      ### {{label:crm_bulk_assign_owner}}

      Choose the user who will own the selected records. The review step shows the intended work before it runs. Check your selected records and the requested action before continuing. Review the result afterward to confirm which records were processed and whether any require attention.
  - key: process:crm_auto_assign;slot:help
    summary: "Apply the configured assignment rules to the selected contacts."
    content: |
      ### {{label:crm_auto_assign}}

      Apply the configured assignment rules to the selected contacts. The review step shows the intended work before it runs. Check your selected records and the requested action before continuing. Review the result afterward to confirm which records were processed and whether any require attention.
  - key: process:crm_subscribe_to_list;slot:help
    summary: "Choose a list and review consent."
    content: |
      ### {{label:crm_subscribe_to_list}}

      Choose a list and review consent. This action subscribes the selected contacts directly; it does not send a double opt-in confirmation. List membership does not grant marketing consent. The review step shows the intended work before it runs. Check your selected records and the requested action before continuing. Review the result afterward to confirm which records were processed and whether any require attention.
  - key: process:crm_unsubscribe_from_list;slot:help
    summary: "Withdraw list membership for the selected contacts."
    content: |
