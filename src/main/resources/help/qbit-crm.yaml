  - key: table:crm_lead_score_rule;slot:help
    summary: "Conditions that add or subtract lead-score points."
    content: |
      Use **Lead Score Rules** to define the conditions that add or subtract points. Choose the record type, the value to examine, a comparison and the score adjustment. Review enabled rules together so their effects match your priorities. **Recalculate Score** applies the rules to selected contacts; background calculation refreshes contact scores when your administrator configures it.

      **How rows get created:** Add a rule with **New** and choose a field, comparison and score adjustment. Use **Recalculate Score** on contacts to apply rules immediately. Background calculation requires your administrator to configure scheduling or invoke it.
