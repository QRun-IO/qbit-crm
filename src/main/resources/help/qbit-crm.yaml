  - key: table:crm_pipeline;slot:help
    summary: "Sales pipelines that group stages."
    content: |
      Use **Pipelines** to organize the stages of your sales process. Open a pipeline to review and order its stages, including the stages that represent won and lost deals. Choose the default pipeline deliberately. Before creating deals, make sure the pipeline has the stages you need and that their outcomes reflect your sales process.

      **How rows get created:** Add a pipeline with **New**, then add its stages. Choose the default pipeline for your sales process. If your administrator installs the optional CRM defaults, it seeds starter records where applicable. Review the records configured for your installation.
