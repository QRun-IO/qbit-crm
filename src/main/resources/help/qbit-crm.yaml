  - key: process:crm_bulk_assign_owner;slot:help
    summary: "Assign Owner for selected contact records."
    content: |
      Choose the user who will own the selected records. The review step shows the intended work before it runs.
  - key: process:crm_auto_assign;slot:help
    summary: "Auto-Assign for selected contact records."
    content: |
      Apply the configured assignment rules to the selected contacts. The review step shows the intended work before it runs.
  - key: process:crm_subscribe_to_list;slot:help
    summary: "Add to List for selected contact records."
    content: |
      Choose a list and review consent. Double opt-in lists require confirmation before membership becomes subscribed. The review step shows the intended work before it runs.
  - key: process:crm_unsubscribe_from_list;slot:help
    summary: "Remove from List for selected contact records."
    content: |
      Withdraw list membership for the selected contacts. This records the unsubscribe. The review step shows the intended work before it runs.
  - key: process:crm_enroll_in_sequence;slot:help
    summary: "Enroll in Sequence for selected contact records."
    content: |
      Enroll the selected contacts in a sequence after checking eligibility and timing. The review step shows the intended work before it runs.
  - key: process:crm_unenroll_from_sequence;slot:help
    summary: "Unenroll from Sequence for selected contact records."
    content: |
      Stop sequence progression for the selected contacts. The review step shows the intended work before it runs.
  - key: process:crm_log_activity;slot:help
    summary: "Log Activity for selected contact records."
    content: |
      Record an interaction for the selected records. Select an activity type and matching outcome. The review step shows the intended work before it runs.
  - key: process:crm_recalculate_score;slot:help
    summary: "Recalculate Score for selected contact records."
    content: |
      Recalculate scores from the configured lead-score rules. The review step shows the intended work before it runs.
  - key: process:crm_merge_contacts;slot:help
    summary: "Merge Contacts for selected contact records."
    content: |
      Select exactly two records and choose the survivor. Related records move to the survivor; review carefully before confirming. The review step shows the intended work before it runs.
  - key: process:crm_detect_duplicates;slot:help
    summary: "Find Duplicates for selected contact records."
    content: |
      Find potential duplicates for review. This action does not decide which record should survive a merge. The review step shows the intended work before it runs.
  - key: process:crm_convert_lead;slot:help
    summary: "Create Deal for selected contact records."
    content: |
      Create a sales opportunity from the selected contact, with a pipeline and stage. The review step shows the intended work before it runs.
  - key: process:crm_gdpr_anonymize_contact;slot:help
    summary: "Erase Personal Data for selected contact records."
    content: |
      Permanently anonymize the selected contacts and related personal data, redact audit details and stop sequences. This requires CRM admin access. Review the selection before confirming. The review step shows the intended work before it runs.
  - key: process:crm_send_email;slot:help
    summary: "Send Email for selected contact records."
    content: |
      Send a message through the configured transport. Review the recipient, subject and content; marketing consent is enforced. The review step shows the intended work before it runs.
  - key: process:crm_assign_company_owner;slot:help
    summary: "Assign Owner for selected company records."
    content: |
      Choose the user who will own the selected records. The review step shows the intended work before it runs.
  - key: process:crm_merge_companies;slot:help
    summary: "Merge Companies for selected company records."
    content: |
      Select exactly two records and choose the survivor. Related records move to the survivor; review carefully before confirming. The review step shows the intended work before it runs.
  - key: process:crm_find_duplicate_companies;slot:help
    summary: "Find Duplicates for selected company records."
    content: |
      Find potential duplicates for review. This action does not decide which record should survive a merge. The review step shows the intended work before it runs.
  - key: process:crm_log_company_activity;slot:help
    summary: "Log Activity for selected company records."
    content: |
      Record an interaction for the selected records. Select an activity type and matching outcome. The review step shows the intended work before it runs.
  - key: process:crm_move_deal_stage;slot:help
    summary: "Move Stage for selected deal records."
    content: |
      Choose a stage in the current pipeline. Required fields and stage membership are validated. The review step shows the intended work before it runs.
  - key: process:crm_mark_deal_won;slot:help
    summary: "Mark Won for selected deal records."
    content: |
      Move the selected deals to a won stage and record the close date. The review step shows the intended work before it runs.
  - key: process:crm_mark_deal_lost;slot:help
    summary: "Mark Lost for selected deal records."
    content: |
      Move the selected deals to a lost stage and record why they were lost. The review step shows the intended work before it runs.
  - key: process:crm_reopen_deal;slot:help
    summary: "Reopen for selected deal records."
    content: |
      Return closed deals to an open stage and clear the close date. The review step shows the intended work before it runs.
  - key: process:crm_clone_deal;slot:help
    summary: "Clone for selected deal records."
    content: |
      Create a new opportunity from an existing deal. Review the copied values before using the new record. The review step shows the intended work before it runs.
  - key: process:crm_transfer_ownership;slot:help
