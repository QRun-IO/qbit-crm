    content: |
      Use **Sales Goals** to set a revenue target for a user and period. Choose the dates, target amount and currency, and optionally limit the goal to one pipeline. The **Goals** card compares current targets with won deals in the period. Review the dates and owner when a result differs from your expectations.

      **How rows get created:** Add a target with **New**, choosing the owner, period, currency and optional pipeline. Review progress on the **Goals** card.
