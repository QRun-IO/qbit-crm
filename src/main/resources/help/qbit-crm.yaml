    content: |
      Use **{{label:crm_pipeline_stage}}** to review ordered stages within a pipeline, with probability, required fields and won or lost outcomes.

      **How rows get created:** Add stages from the pipeline record. Set their order, probability and any required deal fields. Mark the stages that represent won and lost deals. If your administrator installs the optional CRM defaults, it seeds starter records where applicable. Review the records configured for your installation.
