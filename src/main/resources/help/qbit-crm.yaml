  - key: table:crm_assignment_rule;slot:help
    summary: "Rules for selecting the owner of a new contact or deal."
    content: |
      Use **Assignment Rules** to choose who receives contacts or deals. Set the matching conditions and choose **Specific User**, **Round Robin** or **Least Active**. For a group strategy, add the eligible users under **Members**. Review rule order and active membership before applying automatic assignment so the selected owner reflects your intended routing.

      **How rows get created:** Add a rule with **New**, then choose its matching conditions and owner-selection strategy. Add eligible users under **Members** for group assignment.
