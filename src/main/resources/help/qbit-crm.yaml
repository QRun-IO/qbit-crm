    summary: "The currency used for monetary amounts."
  - key: table:crm_currency;field:exchangeRateToBase
    summary: "The multiplier used to convert an amount into the base currency."
    content: |
      Enter the multiplier from this currency to your reporting base currency. Conversion multiplies the amount by this rate and rounds to two decimal places. Review rates before relying on converted deal values or goals. Keep the base currency and rate settings consistent with the currency used for your reporting.
