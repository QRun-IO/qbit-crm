  - key: table:crm_contact;slot:help
    summary: "People and their relationship with your organization."
    content: |
      Use **Contacts** to keep the people you work with, their company, contact details and relationship stage together. Set **Lifecycle Stage** and **Lead Source** to describe the relationship. Open the related lists to review deals, activities, list memberships and email history. Before sending marketing email, check the contact's consent and communication restrictions.

      **How rows get created:** Add a person with **New**, import contacts, or use your configured intake and **Convert to Contact** workflows. Set the lifecycle stage and lead source for the relationship.
