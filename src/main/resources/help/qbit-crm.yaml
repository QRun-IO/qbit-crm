  - key: table:crm_form_submission;slot:help
    summary: "Web leads captured from forms, including consent evidence and attribution."
    content: |
      Use **Web Leads** to review incoming form submissions, including the submitted message, contact details and consent evidence. Check the information before using **Convert to Contact**. Conversion links the submission to a contact or creates one when appropriate. The submission keeps the original form context so you can understand where the relationship began.

      **How rows get created:** Your configured form integration creates web leads. Review each submission and use **Convert to Contact** to link or create the contact.
