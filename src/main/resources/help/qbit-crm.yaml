  - key: table:crm_currency;slot:help
    summary: "Currency codes and exchange rates used to report deal values in a base currency."
    content: |
      Use **{{label:crm_currency}}** to review currency codes and exchange rates used to report deal values in a base currency.

      **How rows get created:** Add currencies with **New** and set their exchange rates to your reporting base currency. Updating a rate stamps its last-updated date. Check the base currency before relying on converted totals. If your administrator installs the optional CRM defaults, it seeds starter records where applicable. Review the records configured for your installation.
