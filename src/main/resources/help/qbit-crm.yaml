  - key: process:crm_expire_consents;slot:help
    summary: "Expire unconfirmed list memberships and count consent records past their expiry date."
    content: |
      ### {{label:crm_expire_consents}}

      Review **List Members** when a subscription remains unconfirmed. This background action withdraws pending memberships after the confirmation waiting period and invalidates their confirmation tokens. It also counts consent records whose expiry dates have passed; it does not rewrite those consent decisions. Marketing eligibility checks expiry dates independently. Your administrator configures when this action runs.
  - key: process:crm_process_sequence_steps;slot:help
    summary: "Advance due active sequence enrollments."
    content: |
      ### {{label:crm_process_sequence_steps}}

      This background action advances active enrollments that are due. It respects the sequence's weekday and sending-window settings in the contact's time zone. Email steps require an eligible recipient and working email delivery. Review enrollment status, the next step date and the last failure message when an expected step has not run. Your administrator configures scheduling or invokes this action directly.
  - key: process:crm_sync_email_delivery;slot:help
    summary: "Refresh CRM delivery states from the configured email provider."
    content: |
      ### {{label:crm_sync_email_delivery}}

      This background action refreshes CRM email delivery information from the configured email provider. Review **Email Messages** to see the recorded delivery state and associated dates. Sending and delivery are separate events, so a sent message may still be awaiting a delivery update. Check provider results when the recorded state needs investigation. Your administrator configures scheduling or invokes this action directly.
